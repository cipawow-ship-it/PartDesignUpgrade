<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f0f0f0" rx="6"/>
  <!-- left wall -->
  <rect x="8" y="8" width="14" height="48" fill="#9aa7b3" stroke="#3f4b57" stroke-width="2"/>
  <!-- right wall -->
  <rect x="42" y="8" width="14" height="48" fill="#9aa7b3" stroke="#3f4b57" stroke-width="2"/>
  <!-- rib plate centered between the two walls (trapezoid contact lengths) -->
  <polygon points="22,52 42,52 40,18 24,18" fill="#d8e4f0" stroke="#2a7ab5" stroke-width="2"/>
  <line x1="24" y1="30" x2="40" y2="24" stroke="#5b9bd5" stroke-width="2"/>
</svg>