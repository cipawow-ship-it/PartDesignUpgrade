<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f0f0f0" rx="6"/>
  <!-- body slab -->
  <rect x="8" y="8" width="16" height="48" fill="#9aa7b3" stroke="#3f4b57" stroke-width="2"/>
  <!-- subtractive rib: violet, like native subtractive tools -->
  <polygon points="24,52 50,20 50,8 24,8" fill="#b39ddb" stroke="#673ab7" stroke-width="2"/>
  <line x1="24" y1="52" x2="50" y2="20" stroke="#9575cd" stroke-width="2"/>
  <!-- minus mark -->
  <line x1="44" y1="30" x2="56" y2="30" stroke="#c62828" stroke-width="4"/>
  <!-- extension line -->
  <line x1="50" y1="20" x2="56" y2="14" stroke="#b0b7bd" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>