<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f0f0f0" rx="6"/>
  <!-- body slab -->
  <rect x="8" y="8" width="16" height="48" fill="#9aa7b3" stroke="#3f4b57" stroke-width="2"/>
  <!-- stiffening rib: triangle leaning against the slab -->
  <polygon points="24,52 50,20 50,8 24,8" fill="#d8e4f0" stroke="#2a7ab5" stroke-width="2"/>
  <line x1="24" y1="52" x2="50" y2="20" stroke="#5b9bd5" stroke-width="2"/>
  <!-- extension line -->
  <line x1="50" y1="20" x2="56" y2="14" stroke="#b0b7bd" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>